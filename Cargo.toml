[package]
name = "zetlyn"
version = "0.3.10"
edition = "2021"
rust-version = "1.80"
publish = false
license = "Apache-2.0"

[dependencies]
# Browsing, faceting, filtering and full text are one query over one file.
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Read only by `zetlyn migrate`, for the files written before 0.2.
toml = "0.8"
# Every file a person writes. Pure Rust, no panics on input, and errors that name the line.
serde-saphyr = "1.3"
sha2 = "0.10"
# The source's own excerpt beside each version, compressed. Pure Rust and nothing else.
miniz_oxide = "0.9"
# Payloads on a hub are gzip. Already built for calamine, with the same pure-Rust backend.
flate2 = "1"
csv = "1"
# Outward only, and rustls: one crate asking for native TLS puts OpenSSL in every binary.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# RSS and Atom. calamine pulls it too; named here because this asks for it directly.
quick-xml = "0.31"
calamine = "0.26"
maud = "0.27"
tiny_http = "0.12"
# A finite-automaton engine, so a pattern in a declaration cannot take the process down.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
# A published version is signed by its publisher, and a subscriber following a tag pins the key.
# Verifying is the whole of what a subscriber does with this; the rest is the publisher's.
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std", "fast", "zeroize"] }
# A source that is a query against PostgreSQL. Synchronous, over rustls with the ring provider
# ureq already brings, so no second TLS stack and no C crypto in the binary.
postgres = { version = "0.19", default-features = false }
tokio-postgres-rustls = { version = "0.14", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# A source that is a web page: its items by CSS selector. html5ever underneath, as browsers parse.
scraper = "0.23"

[profile.release]
strip = true
